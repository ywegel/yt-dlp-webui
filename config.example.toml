[server]
host = "0.0.0.0"
port = 8080

[jobs]
max_concurrent = 3
# How long a finished download is kept before it is deleted.
file_ttl_secs = 600
# How often the reaper checks for expired downloads.
reaper_interval_secs = 60
# How long an expired or failed job entry is kept in the database before being deleted.
db_entry_ttl_secs = 2592000 # 30 days
