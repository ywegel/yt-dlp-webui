<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --text:#18181b;
    --text-2:#6c6c74;
    --text-3:#a6a6ad;
    --border:#e7e7e9;
    --border-2:#d8d8dc;
    --track:#ececee;
    --field:#fbfbfa;

    /* ── Die einzige Akzentfarbe. Hier eine Zeile ändern, um alles umzufärben. ── */
    --accent:#fb4f14;
    --accent-press:#dd420e;
    --accent-soft:rgba(251,79,20,.13);

    --radius:16px;
    --radius-sm:11px;
    --sans:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c0c0d;
      --card:#161618;
      --text:#fafafa;
      --text-2:#a3a3ab;
      --text-3:#6c6c74;
      --border:#262629;
      --border-2:#313135;
      --track:#262629;
      --field:#1d1d20;
      --accent:#ff5a26;
      --accent-press:#fb4f14;
      --accent-soft:rgba(255,90,38,.16);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    line-height:1.5;
  }

  .card{
    width:100%;
    max-width:452px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px 30px 24px;
  }

  /* ── Kopf ── */
  .head{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .kicker{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-3);
    margin:0 0 14px;
  }
  h1{
    font-size:25px;
    font-weight:600;
    letter-spacing:-.02em;
    margin:0;
  }
  .dot-mark{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    transform:translateY(-3px);
  }
  .sub{ color:var(--text-2); font-size:14px; margin:0 0 26px; }

  /* ── Label ── */
  label.field-label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-2);
    margin:0 0 9px;
  }

  /* ── URL-Eingabe ── */
  .input{
    width:100%;
    height:50px;
    padding:0 15px;
    font-family:var(--sans);
    font-size:15px;
    color:var(--text);
    background:var(--field);
    border:1px solid var(--border-2);
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .input::placeholder{ color:var(--text-3); }
  .input:focus-visible{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
    background:var(--card);
  }

  /* ── Segmentierte Auswahl (Video / Audio) ── */
  .seg{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
    padding:3px;
    background:var(--track);
    border-radius:var(--radius-sm);
    margin:20px 0 22px;
  }
  .seg button{
    appearance:none;
    border:0;
    background:transparent;
    font-family:var(--sans);
    font-size:14px;
    font-weight:500;
    color:var(--text-2);
    height:40px;
    border-radius:8px;
    cursor:pointer;
    transition:color .15s, background .2s, box-shadow .2s;
  }
  .seg button[aria-checked="true"]{
    background:var(--card);
    color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,.07);
  }
  .seg button:focus-visible{ box-shadow:0 0 0 3px var(--accent-soft); }

  /* ── Aktion ── */
  .submit{
    width:100%;
    height:50px;
    border:0;
    border-radius:var(--radius-sm);
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:background .15s, transform .05s;
  }
  .submit:hover{ background:var(--accent-press); }
  .submit:active{ transform:scale(.992); }
  .submit:disabled{ opacity:.55; cursor:default; }
  .submit svg{ width:16px; height:16px; }

  /* ── Ergebnis-/Fortschrittsbereich ── */
  .panel{ margin-top:22px; display:none; }
  .panel.show{ display:block; }

  .meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:11px;
  }
  .title{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--text);
  }
  .pct{
    font-family:var(--mono);
    font-size:13px;
    font-weight:500;
    color:var(--text-2);
    flex:none;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    height:6px;
    background:var(--track);
    border-radius:99px;
    overflow:hidden;
  }
  .fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:99px;
    transition:width .35s cubic-bezier(.3,.7,.2,1);
  }

  /* ── Fertig ── */
  .done{ display:none; }
  .done.show{ display:block; }
  .done-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 15px;
    border:1px solid var(--border-2);
    border-radius:var(--radius-sm);
    margin-bottom:12px;
  }
  .check{
    width:30px; height:30px; flex:none;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:grid; place-items:center;
  }
  .check svg{ width:15px; height:15px; }
  .done-name{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .done-name small{ display:block; color:var(--text-3); font-family:var(--mono); font-size:11px; }
  .save{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; height:48px;
    text-decoration:none;
    border:1px solid var(--accent);
    color:var(--accent);
    background:transparent;
    border-radius:var(--radius-sm);
    font-weight:600; font-size:15px;
    transition:background .15s, color .15s;
  }
  .save:hover{ background:var(--accent); color:#fff; }
  .save svg{ width:16px; height:16px; }

  /* ── Fehler (monochrom, bewusst keine zweite Farbe) ── */
  .error{ display:none; }
  .error.show{ display:block; }
  .error-box{
    padding:13px 15px;
    border:1px solid var(--border-2);
    border-left:3px solid var(--text);
    border-radius:var(--radius-sm);
    background:var(--field);
    font-size:14px;
  }
  .error-box strong{ font-weight:600; }
  .error-box span{ color:var(--text-2); }

  /* ── Zurücksetzen ── */
  .reset{
    display:none;
    width:100%;
    margin-top:13px;
    background:none; border:0;
    font-family:var(--mono);
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-3);
    cursor:pointer;
    padding:6px;
  }
  .reset.show{ display:block; }
  .reset:hover{ color:var(--text); }

  /* ── Status-Konsole am Fuß ── */
  .console{
    display:flex; align-items:center; gap:8px;
    margin-top:24px; padding-top:16px;
    border-top:1px solid var(--border);
    font-family:var(--mono);
    font-size:11px; letter-spacing:.08em;
    color:var(--text-3);
  }
  .console .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-3);
    transition:background .2s;
  }
  .console.running .dot{ background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  .console.done .dot{ background:var(--accent); }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── Einblendung beim Laden ── */
  @keyframes rise{ from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none} }
  .reveal{ animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
  @media (prefers-reduced-motion: reduce){
    .reveal{ animation:none; }
    .fill{ transition:none; }
    .console.running .dot{ animation:none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="kicker reveal" style="animation-delay:.02s">Self-hosted</p>
    <div class="head reveal" style="animation-delay:.06s">
      <h1>Downloader</h1>
      <span class="dot-mark"></span>
    </div>
    <p class="sub reveal" style="animation-delay:.1s">Link einfügen, Format wählen, herunterladen.</p>

    <div class="reveal" style="animation-delay:.14s">
      <label class="field-label" for="url">Link</label>
      <input id="url" class="input" type="url" inputmode="url" placeholder="https://…" autocomplete="off" spellcheck="false">
    </div>

    <div class="seg reveal" role="radiogroup" aria-label="Format" style="animation-delay:.18s">
      <button type="button" role="radio" aria-checked="true"  data-mode="video">Video</button>
      <button type="button" role="radio" aria-checked="false" data-mode="audio">Nur Audio</button>
    </div>

    <button id="go" class="submit reveal" style="animation-delay:.22s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>
      Herunterladen
    </button>

    <!-- Fortschritt -->
    <section class="panel" id="panel" aria-live="polite">
      <div class="meta">
        <span class="title" id="title">Wird vorbereitet…</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </section>

    <!-- Fertig -->
    <section class="done" id="doneBox" aria-live="polite">
      <div class="done-row">
        <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="done-name" id="doneName">Datei<small>bereit</small></span>
      </div>
      <a class="save" id="save" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Datei speichern
      </a>
    </section>

    <!-- Fehler -->
    <section class="error" id="errorBox" aria-live="polite">
      <div class="error-box"><strong>Download fehlgeschlagen.</strong> <span id="errMsg">Bitte Link prüfen und erneut versuchen.</span></div>
    </section>

    <button class="reset" id="reset">Neuer Download</button>

    <div class="console" id="console">
      <span class="dot"></span><span id="statusText">bereit</span>
    </div>
  </main>

<script>
  const el = id => document.getElementById(id);
  const url = el('url'), go = el('go');
  const panel = el('panel'), fill = el('fill'), pct = el('pct'), title = el('title');
  const doneBox = el('doneBox'), doneName = el('doneName'), save = el('save');
  const errorBox = el('errorBox'), errMsg = el('errMsg');
  const reset = el('reset'), cons = el('console'), statusText = el('statusText');

  let mode = 'video';
  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-checked', 'false'));
      b.setAttribute('aria-checked', 'true');
      mode = b.dataset.mode;
    });
  });

  function setStatus(state, text){
    cons.className = 'console' + (state ? ' ' + state : '');
    statusText.textContent = text;
  }
  function showRunning(){
    panel.classList.add('show'); doneBox.classList.remove('show');
    errorBox.classList.remove('show'); reset.classList.remove('show');
    go.disabled = true; url.disabled = true;
    setStatus('running', 'lädt…');
  }
  function showDone(name, href){
    panel.classList.remove('show'); errorBox.classList.remove('show');
    doneName.innerHTML = name.replace(/</g,'&lt;') + '<small>fertig</small>';
    save.setAttribute('href', href);
    save.setAttribute('download', name);
    doneBox.classList.add('show'); reset.classList.add('show');
    setStatus('done', 'fertig');
  }
  function showError(msg){
    panel.classList.remove('show'); doneBox.classList.remove('show');
    errMsg.textContent = msg;
    errorBox.classList.add('show'); reset.classList.add('show');
    go.disabled = false; url.disabled = false;
    setStatus('', 'fehler');
  }
  function resetAll(){
    panel.classList.remove('show'); doneBox.classList.remove('show');
    errorBox.classList.remove('show'); reset.classList.remove('show');
    fill.style.width = '0%'; pct.textContent = '0%';
    go.disabled = false; url.disabled = false; url.value = '';
    setStatus('', 'bereit'); url.focus();
  }
  reset.addEventListener('click', resetAll);

  go.addEventListener('click', () => {
    const value = url.value.trim();
    if(!value){
      url.focus();
      url.style.borderColor = 'var(--accent)';
      setTimeout(() => url.style.borderColor = '', 800);
      return;
    }
    start(value, mode);
  });
  url.addEventListener('keydown', e => { if(e.key === 'Enter') go.click(); });

  async function start(value, mode){
    showRunning();
    const r = await fetch('/api/submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url:value, mode })
    });
    const { id } = await r.json();
    const es = new EventSource(`/api/jobs/${id}/events`);
    es.onmessage = e => {
      const p = JSON.parse(e.data);
      if(p.status === 'Running'){ fill.style.width = p.percent+'%'; pct.textContent = Math.round(p.percent)+'%'; }
      if(p.status === 'Done'){   es.close(); showDone(p.file.split('/').pop(), `/api/jobs/${id}/file`); }
      if(p.status === 'Failed'){ es.close(); showError(p.error); }
    };
  }
</script>
</body>
</html>
